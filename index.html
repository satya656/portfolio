<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Top Product Leader - Google Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: arial, sans-serif;
      background: #fff;
      color: #202124;
      font-size: 16px;
    }

    a { text-decoration: none; }

    /* ── TOP NAV ── */
    .g-topnav {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 8px 24px;
      gap: 16px;
      border-bottom: 1px solid #ebebeb;
      font-size: 16px;
      max-width: 1280px;
      margin: 0 auto;
    }
    .g-topnav a {
      color: #5f6368;
      font-size: 16px;
    }
    .g-topnav a:hover { text-decoration: underline; color: #202124; }

    /* ── HEADER ── */
    .g-header {
      padding: 16px 24px 0;
      display: flex;
      align-items: center;
      gap: 24px;
      max-width: 1280px;
      margin: 0 auto;
    }
    .g-logo {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .g-logo img {
      height: 54px;
      width: auto;
    }

    .g-searchbar-wrap { display: flex; align-items: center; gap: 12px; flex: 1; max-width: 580px; }
    .g-searchbar {
      display: flex;
      align-items: center;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      padding: 8px 16px;
      gap: 10px;
      flex: 1;
      box-shadow: 0 1px 6px rgba(32,33,36,.1);
    }
    .g-searchbar:hover { box-shadow: 0 1px 6px rgba(32,33,36,.2); }
    .g-searchbar input {
      border: none; outline: none;
      font-size: 16px; color: #202124;
      flex: 1; background: transparent;
      font-family: arial, sans-serif;
    }
    .g-searchbar svg { width: 18px; height: 18px; color: #70757a; flex-shrink: 0; }
    .g-searchbar .mic-icon { color: #4285F4; }
    .g-search-btn {
      background: #f8f9fa;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 16px;
      color: #202124;
      cursor: pointer;
      white-space: nowrap;
    }
    .g-search-btn:hover { box-shadow: 0 1px 3px rgba(0,0,0,.2); border-color: #dadce0; color: #202124; }

    /* ── RESULT TABS ── */
    .g-tabs {
      display: flex;
      align-items: center;
      padding: 6px 24px 0 24px;
      border-bottom: 1px solid #ebebeb;
      margin-top: 10px;
      max-width: 1280px;
      margin-left: auto;
      margin-right: auto;
    }
    .g-tab {
      padding: 10px 14px;
      font-size: 16px;
      color: #5f6368;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      display: flex; align-items: center; gap: 5px;
      white-space: nowrap;
    }
    .g-tab.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 500; }
    .g-tab:hover:not(.active) { color: #202124; border-bottom-color: #ddd; }
    .g-tab svg { width: 14px; height: 14px; }
    .g-tab-sep { margin-left: auto; border-left: 1px solid #ebebeb; padding-left: 14px; }

    /* ── MAIN LAYOUT ── */
    .g-body {
      display: flex;
      padding: 0 24px;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ── LEFT SIDEBAR ── */
    .g-sidebar {
      width: 230px;
      flex-shrink: 0;
      padding: 16px 28px 0 0;
    }
    .g-sidebar-photo {
      width: 90px; height: 90px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 14px;
      border: 2px solid #dadce0;
      position: relative;
    }
    .g-sidebar-photo img {
      position: absolute;
      width: 155%;
      height: auto;
      top: -10px;
      left: -24px;
    }
    .g-sidebar-name {
      font-size: 16px;
      font-weight: 700;
      color: #202124;
      margin-bottom: 2px;
    }
    .g-sidebar-title {
      font-size: 16px;
      color: #5f6368;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .g-sidebar-contact {
      font-size: 16px;
      color: #4d5156;
      line-height: 1.9;
      margin-bottom: 14px;
      border-top: 1px solid #ebebeb;
      padding-top: 12px;
      word-break: break-all;
    }
    .g-sidebar-contact a { color: #1a0dab; }
    .g-sidebar-contact a:hover { text-decoration: underline; }
    .g-sidebar-section {
      font-size: 16px;
      font-weight: 700;
      color: #70757a;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin: 12px 0 6px;
      border-top: 1px solid #ebebeb;
      padding-top: 12px;
    }
    .g-sidebar-item {
      font-size: 16px;
      color: #4d5156;
      line-height: 1.8;
    }
    .g-sidebar-item strong { color: #202124; }

    /* ── RESULTS COLUMN ── */
    .g-results {
      flex: 1;
      min-width: 0;
      padding: 16px 0 40px 24px;
    }

    .g-result-count {
      font-size: 16px;
      color: #70757a;
      margin-bottom: 18px;
    }

    /* ── INDIVIDUAL RESULT ── */
    .g-result {
      margin-bottom: 30px;
    }
    .g-result-url-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }
    .g-favicon {
      width: 16px; height: 16px; border-radius: 2px;
      flex-shrink: 0; object-fit: contain;
    }

    /* ── DID YOU MEAN ── */
    .g-did-you-mean {
      font-size: 16px; color: #70757a;
      margin-bottom: 10px;
    }
    .g-did-you-mean a { color: #1a0dab; font-style: italic; font-weight: 500; }
    .g-did-you-mean a:hover { text-decoration: underline; }

    /* ── CTA BANNER ── */
    .g-cta {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px;
      background: #e8f0fe;
      border: 1px solid #c5d8fd;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 18px;
    }
    .g-cta-text { font-size: 16px; color: #202124; line-height: 1.5; }
    .g-cta-text strong { color: #1a73e8; }
    .g-cta-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .g-cta-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; border-radius: 4px; font-size: 16px;
      font-weight: 500; cursor: pointer; white-space: nowrap;
      text-decoration: none;
    }
    .g-cta-btn.primary { background: #1a73e8; color: #fff; border: 1px solid #1a73e8; }
    .g-cta-btn.primary:hover { background: #1557b0; }
    .g-cta-btn.secondary { background: #fff; color: #1a73e8; border: 1px solid #dadce0; }
    .g-cta-btn.secondary:hover { background: #f8f9fa; border-color: #1a73e8; }

    /* ── KEYWORDS ── */
    .g-keywords {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid #ebebeb;
    }
    .g-kw {
      display: inline-flex; align-items: center; gap: 4px;
      background: #f8f9fa; border: 1px solid #dadce0;
      border-radius: 14px; padding: 4px 12px;
      font-size: 14px; color: #202124; cursor: pointer; white-space: nowrap;
    }
    .g-kw:hover { background: #e8f0fe; border-color: #1a73e8; color: #1a73e8; }
    .g-kw-icon { font-size: 16px; }
    .g-url-text { font-size: 16px; color: #202124; }
    .g-url-crumb { font-size: 16px; color: #70757a; }
    .g-result-title {
      font-size: 20px;
      font-weight: 400;
      color: #1a0dab;
      line-height: 1.3;
      margin-bottom: 4px;
      cursor: pointer;
    }
    .g-result-title:hover { text-decoration: underline; }
    .g-result-snippet {
      font-size: 16px;
      color: #4d5156;
      line-height: 1.6;
    }
    .g-result-snippet strong { color: #202124; font-weight: 700; }
    .g-result-date { color: #70757a; }

    /* Expanded detail block */
    .g-detail {
      margin-top: 10px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      overflow: hidden;
    }
    .g-detail-head {
      background: #f8f9fa;
      border-bottom: 1px solid #dadce0;
      padding: 10px 14px;
      font-size: 16px;
      color: #5f6368;
    }
    .g-exp-row {
      padding: 12px 14px;
      border-bottom: 1px solid #f1f3f4;
    }
    .g-exp-row:last-child { border-bottom: none; }
    .g-exp-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 5px;
    }
    .g-exp-role { font-size: 16px; font-weight: 500; color: #202124; }
    .g-exp-co { font-size: 16px; color: #1a73e8; }
    .g-exp-date { font-size: 16px; color: #70757a; white-space: nowrap; }
    .g-bullets { list-style: none; padding: 0; }
    .g-bullets li {
      font-size: 16px; color: #4d5156;
      padding: 2px 0 2px 14px; position: relative; line-height: 1.55;
    }
    .g-bullets li::before { content: '·'; position: absolute; left: 3px; color: #70757a; }
    .g-bullets li strong { color: #202124; }

    /* ── FEATURED SNIPPET ── */
    .g-featured {
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 28px;
    }
    .g-featured-label {
      font-size: 16px; color: #70757a; text-transform: uppercase;
      letter-spacing: .5px; margin-bottom: 12px;
    }
    .g-stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 6px;
    }
    .g-stat-box {
      background: #f8f9fa; border-radius: 6px;
      text-align: center; padding: 10px 6px;
      border: 1px solid #e8eaed;
    }
    .g-stat-box .n {
      font-size: 1.5rem; font-weight: 700;
      color: #1a73e8; line-height: 1;
    }
    .g-stat-box .l {
      font-size: .68rem; color: #70757a;
      margin-top: 3px; line-height: 1.3;
    }
    .g-featured-src { font-size: 16px; color: #70757a; margin-top: 8px; }

    /* ── PEOPLE ALSO ASK ── */
    .g-paa { border: 1px solid #dadce0; border-radius: 8px; margin-bottom: 28px; overflow: hidden; }
    .g-paa-head { font-size: 16px; font-weight: 500; padding: 12px 14px; color: #202124; background: #f8f9fa; border-bottom: 1px solid #dadce0; }
    .g-paa-item { border-bottom: 1px solid #dadce0; }
    .g-paa-item:last-child { border-bottom: none; }
    .g-paa-q {
      padding: 12px 14px; font-size: 16px; color: #202124;
      cursor: pointer; display: flex; justify-content: space-between;
      align-items: center; gap: 10px;
    }
    .g-paa-q:hover { background: #f8f9fa; }
    .g-paa-q svg { width: 18px; height: 18px; color: #70757a; flex-shrink: 0; transition: transform .2s; }
    .g-paa-item.open .g-paa-q svg { transform: rotate(180deg); }
    .g-paa-ans { display: none; padding: 0 14px 12px; font-size: 16px; color: #4d5156; line-height: 1.6; }
    .g-paa-item.open .g-paa-ans { display: block; }

    /* ── METRICS INSIDE RESULT ── */
    .g-metric-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; padding: 12px 14px;
    }
    .g-metric-box {
      background: #f8f9fa; border-radius: 6px;
      text-align: center; padding: 10px 6px;
      border: 1px solid #e8eaed;
    }
    .g-metric-box .mn { font-size: 1.3rem; font-weight: 700; color: #1a73e8; line-height: 1; }
    .g-metric-box.grn .mn { color: #137333; }
    .g-metric-box .ml { font-size: .68rem; color: #70757a; margin-top: 3px; line-height: 1.3; }

    /* ── FLIP CARDS ── */
    .g-flip-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 10px; padding: 12px 14px;
    }
    .flip-card { perspective: 1200px; cursor: pointer; height: 320px; }
    .flip-card-inner {
      position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform .6s cubic-bezier(.4,0,.2,1);
    }
    .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 8px; overflow: hidden;
      border: 1px solid #dadce0;
    }
    .flip-card-front {
      background: #fff;
      display: flex; flex-direction: column;
      padding: 12px 12px 8px;
    }
    .flip-card-back {
      background: #202124;
      transform: rotateY(180deg);
      display: flex; flex-direction: column;
      padding: 14px 14px 10px; color: #e8eaed;
    }
    .fc-title { font-size: .82rem; font-weight: 500; color: #202124; }
    .fc-sub { font-size: .67rem; color: #70757a; margin-bottom: .7rem; }
    .fc-hint { margin-top: auto; padding-top: .5rem; font-size: .65rem; color: #70757a; display: flex; align-items: center; gap: .3rem; border-top: 1px solid #f1f3f4; }
    .fc-hint svg { width: 11px; height: 11px; flex-shrink: 0; }
    .fc-canvas-wrap { flex: 1; min-height: 0; position: relative; }
    .fc-canvas-wrap canvas { position: absolute; inset: 0; }
    .fc-back-eyebrow { font-size: .6rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #8ab4f8; margin-bottom: .4rem; }
    .fc-back-title { font-size: .95rem; font-weight: 500; color: #e8eaed; margin-bottom: .8rem; line-height: 1.3; }
    .fc-back-stats { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; margin-bottom: .8rem; }
    .fc-stat { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); border-radius: 6px; padding: .5rem .5rem; text-align: center; }
    .fc-stat-n { font-size: 1.1rem; font-weight: 700; color: #8ab4f8; line-height: 1; }
    .fc-stat-l { font-size: .58rem; color: rgba(255,255,255,.45); margin-top: .15rem; line-height: 1.25; }
    .fc-back-body { font-size: .72rem; color: rgba(255,255,255,.6); line-height: 1.55; flex: 1; overflow: hidden; }
    .fc-back-hint { margin-top: auto; padding-top: .5rem; font-size: .62rem; color: rgba(255,255,255,.3); display: flex; align-items: center; gap: .3rem; border-top: 1px solid rgba(255,255,255,.07); }
    .fc-back-hint svg { width: 10px; height: 10px; flex-shrink: 0; }

    /* ── SKILLS ── */
    .g-skills-wrap { padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .g-skill-grp h4 { font-size: .72rem; color: #70757a; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; margin-bottom: 6px; }
    .g-skill-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .g-skill-tag { font-size: .75rem; color: #1a73e8; background: #e8f0fe; padding: 3px 10px; border-radius: 999px; }

    /* ── PAGINATION ── */
    .g-pagination {
      text-align: center;
      padding: 30px 0 40px;
      border-top: 1px solid #ebebeb;
      margin-top: 10px;
    }
    .g-pagination-logo {
      font-size: 28px; font-weight: 700; letter-spacing: -1px;
      display: inline-flex; align-items: center; gap: 0;
      margin-bottom: 14px;
    }
    .g-page-links { display: flex; align-items: center; justify-content: center; gap: 4px; }
    .g-page-link {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 36px; height: 36px;
      font-size: 16px; color: #4285F4;
      border-radius: 50%; cursor: pointer;
      padding: 0 6px;
    }
    .g-page-link:hover { background: #f1f3f4; text-decoration: underline; }
    .g-page-link.active { color: #202124; font-weight: 700; text-decoration: underline; }
    .g-page-next {
      display: inline-flex; align-items: center;
      color: #4285F4; font-size: 16px; cursor: pointer;
      gap: 4px; padding: 0 8px;
    }
    .g-page-next:hover { text-decoration: underline; }

    /* ── FOOTER ── */
    .g-footer {
      background: #f2f2f2;
      border-top: 1px solid #e0e0e0;
      padding: 14px 20px;
      font-size: 16px; color: #70757a;
      text-align: center;
    }
    .g-footer a { color: #70757a; margin: 0 10px; }
    .g-footer a:hover { text-decoration: underline; }

    /* ── ANIMATIONS ── */
    .fade-up { opacity: 0; transform: translateY(16px); transition: opacity .5s ease, transform .5s ease; }
    .fade-up.visible { opacity: 1; transform: none; }

    /* ── RESUME PANEL ── */
    #resume-panel {
      display: none;
      flex: 1;
      min-width: 0;
      padding: 12px 0 40px 20px;
      height: calc(100vh - 130px);
    }
    #resume-panel iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(32,33,36,.15);
    }

    /* ── MOBILE ── */
    .topnav-phone-icon { display: none; }
    .topnav-mobile-actions { display: none; }
    @media (max-width: 760px) {
      .topnav-linkedin { display: none !important; }
      .dm-label { display: none; }
      .topnav-phone-text { display: none; }
      .topnav-phone-icon { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; background: #1a7f37; border-radius: 50%; color: #fff !important; }
      .topnav-phone-icon svg { width: 18px; height: 18px; }
      .topnav-mobile-actions { display: inline-flex; align-items: center; gap: 8px; }
      .g-topnav { justify-content: space-between; }
      .dm-toggle { width: 36px; height: 36px; padding: 0; justify-content: center; font-size: 18px; border-radius: 50%; }
      .g-sidebar { display: none; }
      .g-results { padding-left: 0; max-width: 100%; }
      .g-tabs { padding-left: 10px; overflow-x: auto; gap: 0; }
      .g-tabs::-webkit-scrollbar { display: none; }
      .g-header { gap: 10px; padding: 10px 12px 0; flex-wrap: wrap; }
      .g-logo img { height: 36px; }
      .g-searchbar-wrap { flex: 1; min-width: 0; }
      .g-search-btn { display: none; }
      .g-body { padding: 0 12px; }
      .g-topnav { padding: 6px 12px; }
      .g-result-title { font-size: 17px; }
      .g-stat-grid { grid-template-columns: repeat(2, 1fr); }
      .g-flip-grid { grid-template-columns: 1fr; }
      .g-metric-grid { grid-template-columns: repeat(2, 1fr); }
      .g-skills-wrap { grid-template-columns: 1fr; }
      .flip-card { height: 290px; }
      .flip-card-inner { height: 290px; }
      .g-keywords { gap: 6px; }
      .g-kw { font-size: 16px; padding: 4px 11px; }
      .g-detail { overflow-x: hidden; }
      .g-exp-top { flex-direction: column; gap: 2px; }
    }
    @media (max-width: 480px) {
      .g-logo img { height: 28px; }
      .g-searchbar input { font-size: 16px; }
      .g-tab { padding: 8px 10px; font-size: 16px; }
      .g-result-title { font-size: 16px; }
      .g-stat-grid { grid-template-columns: repeat(2, 1fr); }
      .g-metric-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .dm-toggle { background:none; border:1px solid #dadce0; border-radius:20px; padding:4px 10px; font-size: 16px; color:#5f6368; cursor:pointer; display:inline-flex; align-items:center; gap:5px; font-family:arial,sans-serif; }
    .dm-toggle:hover { background:#f1f3f4; }
    body.dark { background:#202124; color:#e8eaed; }
    body.dark .g-topnav { border-color:#3c4043; background:#202124; }
    body.dark .g-topnav a { color:#9aa0a6; }
    body.dark .g-topnav a:hover { color:#e8eaed; }
    body.dark .g-searchbar { border-color:#3c4043; background:#303134; box-shadow:none; }
    body.dark .g-searchbar input { color:#e8eaed; background:transparent; }
    body.dark .g-searchbar svg { color:#9aa0a6; }
    body.dark .g-search-btn { background:#303134; border-color:#303134; color:#e8eaed; }
    body.dark .g-tabs { border-color:#3c4043; }
    body.dark .g-tab { color:#9aa0a6; }
    body.dark .g-tab.active { color:#8ab4f8; border-bottom-color:#8ab4f8; }
    body.dark .g-tab:hover:not(.active) { color:#e8eaed; border-bottom-color:#5f6368; }
    body.dark .g-tab-sep { border-color:#3c4043; }
    body.dark .g-sidebar-name { color:#e8eaed; }
    body.dark .g-sidebar-title { color:#9aa0a6; }
    body.dark .g-sidebar-section { color:#9aa0a6; border-color:#3c4043; }

/* ── Charts ── */
function initCharts(flipCards) {
  Chart.defaults.font.family = "arial, sans-serif";
  Chart.defaults.font.size = 10;
  Chart.defaults.color = '#5f6368';
  Chart.defaults.plugins.legend.display = false;

  const BLUE = '#1a73e8', BLUE2 = '#4285F4', GREEN = '#34a853', RED = '#ea4335', MUTED = '#dadce0';

  flipCards.forEach(card => {
    const el = document.getElementById(card.id);
    if (!el) return;
    const ch = card.chart;

    if (ch.type === 'bar-h') {
      new Chart(el, { type: 'bar', data: { labels: ch.labels, datasets: [{ data: ch.data, backgroundColor: [BLUE, BLUE2, GREEN], borderRadius: 5, borderSkipped: false }] }, options: { indexAxis: 'y', plugins: { tooltip: { callbacks: { label: ctx => ' ' + ch.tooltipFmt.replace('{v}', ctx.parsed.x) } } }, scales: { x: { grid: { color: '#f8f9fa' }, ticks: { callback: v => v + '%' } }, y: { grid: { display: false } } } } });
    } else if (ch.type === 'bar-v') {
      new Chart(el, { type: 'bar', data: { labels: ch.labels, datasets: [{ data: ch.data, backgroundColor: [BLUE, BLUE2, GREEN], borderRadius: 5, borderSkipped: false }] }, options: { plugins: { tooltip: { callbacks: { label: ctx => ' ' + ch.tooltipFmt.replace('{v}', ctx.parsed.y) } } }, scales: { y: { grid: { color: '#f8f9fa' } }, x: { grid: { display: false } } } } });
    } else if (ch.type === 'grouped-bar') {
      Chart.defaults.plugins.legend.display = true;
      new Chart(el, { type: 'bar', data: { labels: ch.labels, datasets: [{ label: 'Before', data: ch.beforeData, backgroundColor: MUTED, borderRadius: 4 }, { label: 'After', data: ch.afterData, backgroundColor: [BLUE, GREEN], borderRadius: 4 }] }, options: { plugins: { legend: { display: true, labels: { boxWidth: 8, padding: 8, color: '#5f6368' } }, tooltip: { callbacks: { label: ctx => ctx.dataset.label === 'After' ? ` ${ctx.parsed.y} (${ch.afterLabels[ctx.dataIndex]})` : ` ${ctx.parsed.y} (baseline)` } } }, scales: { y: { grid: { color: '#f8f9fa' }, ticks: { callback: v => v === 100 ? 'Base' : v } }, x: { grid: { display: false } } } } });
      Chart.defaults.plugins.legend.display = false;
    } else if (ch.type === 'grouped-bar-pct') {
      Chart.defaults.plugins.legend.display = true;
      new Chart(el, { type: 'bar', data: { labels: ch.labels, datasets: [{ label: 'Industry Avg', data: ch.industryData, backgroundColor: MUTED, borderRadius: 4 }, { label: 'Achieved', data: ch.achievedData, backgroundColor: [BLUE, GREEN], borderRadius: 4 }] }, options: { plugins: { legend: { display: true, labels: { boxWidth: 8, padding: 8, color: '#5f6368' } }, tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.y}%` } } }, scales: { y: { grid: { color: '#f8f9fa' }, ticks: { callback: v => v + '%' }, suggestedMax: 75 }, x: { grid: { display: false } } } } });
      Chart.defaults.plugins.legend.display = false;
    } else if (ch.type === 'line') {
      new Chart(el, { type: 'line', data: { labels: ch.labels, datasets: [{ data: ch.data, borderColor: BLUE, backgroundColor: 'rgba(26,115,232,.07)', fill: true, tension: 0.4, pointBackgroundColor: ctx => ctx.dataIndex === ch.launchIndex ? RED : BLUE, pointRadius: ctx => ctx.dataIndex === ch.launchIndex ? 6 : 3, pointBorderWidth: 0 }] }, options: { plugins: { tooltip: { callbacks: { label: ctx => ` DAU Index: ${ctx.parsed.y}` } } }, scales: { y: { grid: { color: '#f8f9fa' }, suggestedMin: 40, suggestedMax: 160 }, x: { grid: { display: false }, ticks: { maxRotation: 30 } } } } });
    }
  });
}

/* ── Animations ── */
function initAnimations() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold: 0.07 });
  document.querySelectorAll('.fade-up').forEach(el => obs.observe(el));

  const cObs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { animateCounter(e.target); cObs.unobserve(e.target); } });
  }, { threshold: 0.5 });
  document.querySelectorAll('.counter').forEach(el => cObs.observe(el));
}

function animateCounter(el) {
  const target = +el.dataset.target, dur = 1500, step = target / (dur / 16);
  let cur = 0;
  const t = setInterval(() => {
    cur = Math.min(cur + step, target);
    el.textContent = Math.floor(cur);
    if (cur >= target) clearInterval(t);
  }, 16);
}

/* ── Tab switching ── */
function showTab(tab) {
  const resultsCol = document.getElementById('results-col');
  const resumePanel = document.getElementById('resume-panel');
  const tabPortfolio = document.getElementById('tab-portfolio');
  const tabResume = document.getElementById('tab-resume');

  if (tab === 'resume') {
    resultsCol.style.display = 'none';
    resumePanel.style.display = 'block';
    tabPortfolio.classList.remove('active');
    tabResume.classList.add('active');
    const iframe = document.getElementById('resume-iframe');
    if (!iframe.getAttribute('src')) iframe.src = 'resume.pdf';
    window.scrollTo(0, 0);
  } else {
    resultsCol.style.display = '';
    resumePanel.style.display = 'none';
    tabResume.classList.remove('active');
    tabPortfolio.classList.add('active');
  }
}

/* ── Bootstrap ── */
async function init() {
  let content = DEFAULT_CONTENT;
  try {
    const controller = new AbortController();
    setTimeout(() => controller.abort(), 2500);
    const res = await fetch('/api/portfolio', { signal: controller.signal });
    if (res.ok) content = await res.json();
  } catch {}

  document.getElementById('page-title').textContent = content.meta.pageTitle;
  document.getElementById('search-input').value = content.meta.searchQuery;
  const liTab = document.getElementById('tab-linkedin');
  if (liTab) liTab.href = content.personal.linkedinUrl;

  renderTopNav(content);
  renderSidebar(content);
  renderResults(content);
  renderFooter(content);
  initCharts(content.projectHighlights.flipCards);
  initAnimations();
  if (window.location.hash === '#resume') showTab('resume');
}

init();

function toggleDarkMode() {
  const dark = document.body.classList.toggle('dark');
  localStorage.setItem('dm', dark ? '1' : '');
  const btn = document.getElementById('dm-btn');
  if (btn) { const lbl = btn.querySelector('.dm-label'); if (lbl) lbl.textContent = dark ? 'Light' : 'Dark'; else btn.textContent = dark ? '☀️ Light' : '🌙 Dark'; btn.firstChild.textContent = dark ? '☀️ ' : '🌙 '; }
}
(function() {
  if (localStorage.getItem('dm')) document.body.classList.add('dark');
})();
document.addEventListener('DOMContentLoaded', function() {
  const btn = document.getElementById('dm-btn');
  if (btn && localStorage.getItem('dm')) { const lbl = btn.querySelector('.dm-label'); if (lbl) lbl.textContent = 'Light'; else btn.textContent = '☀️ Light'; }
});
</script>
